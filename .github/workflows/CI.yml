name: Fortran Compiler Tester CI/CD

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test_fpm:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: ${{ matrix.project.name }}_${{ matrix.config.os }}_${{ matrix.config.compiler }}_fpm
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        project:
          - name: json-fortran
            repo: jacobwilliams/json-fortran
            path: json-fortran

          - name: bspline-fortran
            repo: jacobwilliams/bspline-fortran
            path: bspline-fortran

        config:
          - {os: ubuntu-latest,  compiler: gfortran,  compiler-version: "", extra-packages: "", fpm-version: "", fpm-flag: ""}
          - {os: ubuntu-latest,  compiler: ifx,       compiler-version: "", extra-packages: "", fpm-version: "", fpm-flag: "-fpp"}
          - {os: ubuntu-latest,  compiler: flang-new, compiler-version: "", extra-packages: "", fpm-version: "", fpm-flag: ""}
          - {os: ubuntu-latest,  compiler: nvfortran, compiler-version: "", extra-packages: "", fpm-version: "", fpm-flag: ""}
          - {os: ubuntu-latest,  compiler: lfortran,  compiler-version: "", extra-packages: "", fpm-version: "0.12.0", fpm-flag: "--cpp"}

          - {os: windows-latest, compiler: gfortran,  compiler-version: "", extra-packages: "", fpm-version: "", fpm-flag: ""}
          - {os: windows-latest, compiler: ifx,       compiler-version: "", extra-packages: "", fpm-version: "0.12.0", fpm-flag: "/fpp"}
          - {os: windows-latest, compiler: flang-new, compiler-version: "", extra-packages: "", fpm-version: "", fpm-flag: ""}
          - {os: windows-latest, compiler: lfortran,  compiler-version: "", extra-packages: "", fpm-version: "0.12.0", fpm-flag: "--cpp"}

          - {os: macos-latest,   compiler: gfortran,  compiler-version: "", extra-packages: "", fpm-version: "", fpm-flag: ""}
          - {os: macos-latest,   compiler: lfortran,  compiler-version: "", extra-packages: "", fpm-version: "0.12.0", fpm-flag: "--cpp"}

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.project.repo }}
          path: ${{ matrix.project.path }}

      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: ${{ matrix.config.compiler }}
          compiler-version: ${{ matrix.config.compiler-version }}
          extra-packages: ${{ matrix.config.extra-packages }}
          fpm-version: ${{ matrix.config.fpm-version }}
          checkout-repo: false

      - name: fpm build debug
        if: always()
        working-directory: ${{ matrix.project.path }}
        run: fpm build --compiler ${{ matrix.config.compiler }} --profile debug --flag "${{ matrix.config.fpm-flag }}" --verbose

      - name: fpm build release
        if: always()
        working-directory: ${{ matrix.project.path }}
        run: fpm build --compiler ${{ matrix.config.compiler }} --profile release --flag "${{ matrix.config.fpm-flag }}" --verbose

      - name: fpm test debug
        if: always()
        working-directory: ${{ matrix.project.path }}
        run: fpm test --compiler ${{ matrix.config.compiler }} --profile debug --flag "${{ matrix.config.fpm-flag }}" --verbose

      - name: fpm test release
        if: always()
        working-directory: ${{ matrix.project.path }}
        run: fpm test --compiler ${{ matrix.config.compiler }} --profile release --flag "${{ matrix.config.fpm-flag }}" --verbose
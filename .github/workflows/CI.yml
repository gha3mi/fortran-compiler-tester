name: Fortran Compiler Tester CI/CD

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test_fpm:
    name: ${{matrix.name}}_${{matrix.os}}_${{matrix.compiler}}_fpm
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        include:
          # compiler-version: if any specific compiler version is needed, specify it here, otherwise leave it as an empty string to use the latest version available in conda
          # extra-packages: if any additional packages are needed to be installed via conda, specify them here
          # fpm 0.13.0 issue: https://github.com/fortran-lang/fpm/issues/1248, https://github.com/gha3mi/setup-fortran-conda/issues/140
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: gfortran,  fpm-version: '',       fpm-flag: '--verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: ifx,       fpm-version: '',       fpm-flag: '--flag "-fpp" --verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: flang-new, fpm-version: '',       fpm-flag: '--verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: nvfortran, fpm-version: '',       fpm-flag: '--verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: lfortran,  fpm-version: '0.12.0', fpm-flag: '--flag "--cpp" --verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: windows-latest, compiler: gfortran,  fpm-version: '',       fpm-flag: '--verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: windows-latest, compiler: ifx,       fpm-version: '0.12.0', fpm-flag: '--flag "/fpp" --verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: windows-latest, compiler: flang-new, fpm-version: '',       fpm-flag: '--verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: windows-latest, compiler: lfortran,  fpm-version: '0.12.0', fpm-flag: '--flag "--cpp" --verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: macos-latest,   compiler: gfortran,  fpm-version: '',       fpm-flag: '--verbose'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: macos-latest,   compiler: lfortran,  fpm-version: '0.12.0', fpm-flag: '--flag "--cpp" --verbose'}

          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: gfortran,  fpm-version: '',       fpm-flag: '--verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: ifx,       fpm-version: '',       fpm-flag: '--flag "-fpp" --verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: flang-new, fpm-version: '',       fpm-flag: '--verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: nvfortran, fpm-version: '',       fpm-flag: '--verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: lfortran,  fpm-version: '0.12.0', fpm-flag: '--flag "--cpp" --verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: windows-latest, compiler: gfortran,  fpm-version: '',       fpm-flag: '--verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: windows-latest, compiler: ifx,       fpm-version: '0.12.0', fpm-flag: '--flag "/fpp" --verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: windows-latest, compiler: flang-new, fpm-version: '',       fpm-flag: '--verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: windows-latest, compiler: lfortran,  fpm-version: '0.12.0', fpm-flag: '--flag "--cpp" --verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: macos-latest,   compiler: gfortran,  fpm-version: '',       fpm-flag: '--verbose'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: macos-latest,   compiler: lfortran,  fpm-version: '0.12.0', fpm-flag: '--flag "--cpp" --verbose'}

          # - add more repositories or configurations here
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{matrix.repo}}
          path: ${{matrix.name}}

      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: ${{matrix.compiler}}
          # compiler-version: ${{matrix.compiler-version}}
          # extra-packages: ${{matrix.extra-packages}}
          fpm-version: ${{matrix.fpm-version}}
          checkout-repo: false

      - name: fpm build debug
        if: always()
        working-directory: ${{matrix.name}}
        run: fpm build --profile debug ${{matrix.fpm-flag}}

      - name: fpm build release
        if: always()
        working-directory: ${{matrix.name}}
        run: fpm build --profile release ${{matrix.fpm-flag}}

      # - name: fpm test debug
      #   if: always()
      #   working-directory: ${{matrix.name}}
      #   run: fpm test --profile debug ${{matrix.fpm-flag}}

      # - name: fpm test release
      #   if: always()
      #   working-directory: ${{matrix.name}}
      #   run: fpm test --profile release ${{matrix.fpm-flag}}


  test_cmake:
    name: ${{matrix.name}}_${{matrix.os}}_${{matrix.compiler}}_cmake
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        include:
          # compiler-version: if any specific compiler version is needed, specify it here, otherwise leave it as an empty string to use the latest version available in conda
          # extra-packages: if any additional packages are needed to be installed via conda, specify them here
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: gfortran,  cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: ifx,       cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: flang-new, cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: nvfortran, cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: ubuntu-latest,  compiler: lfortran,  cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: windows-latest, compiler: gfortran,  cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: windows-latest, compiler: ifx,       cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: windows-latest, compiler: flang-new, cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: windows-latest, compiler: lfortran,  cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: macos-latest,   compiler: gfortran,  cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}
          - {name: json-fortran, repo: jacobwilliams/json-fortran, os: macos-latest,   compiler: lfortran,  cmake-options: '-DJSONFORTRAN_STATIC_LIBRARY_ONLY=ON'}

          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: gfortran,  cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: ifx,       cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: flang-new, cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: nvfortran, cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: ubuntu-latest,  compiler: lfortran,  cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: windows-latest, compiler: gfortran,  cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: windows-latest, compiler: ifx,       cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: windows-latest, compiler: flang-new, cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: windows-latest, compiler: lfortran,  cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: macos-latest,   compiler: gfortran,  cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}
          - {name: bspline-fortran, repo: jacobwilliams/bspline-fortran, os: macos-latest,   compiler: lfortran,  cmake-options: '-DBSPLINE_BUILD_SHARED_LIBS=OFF'}

          # - add more repositories or configurations here
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{matrix.repo}}
          path: ${{matrix.name}}

      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: ${{matrix.compiler}}
          # compiler-version: ${{matrix.compiler-version}}
          # extra-packages: ${{matrix.extra-packages}}
          checkout-repo: false

      - name: cmake build debug
        if: always()
        working-directory: ${{matrix.name}}
        run: |
          cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug -G Ninja ${{matrix.cmake-options}}
          cmake --build build/debug --config Debug --verbose

      - name: cmake build release
        if: always()
        working-directory: ${{matrix.name}}
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -G Ninja ${{matrix.cmake-options}}
          cmake --build build/release --config Release --verbose
